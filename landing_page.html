<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .hero {
        background:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
          url("https://via.placeholder.com/1200x600");
        background-size: cover;
        background-position: center;
        height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 0 20px;
      }
      .hero h1 {
        font-size: 48px;
        margin-bottom: 10px;
      }
      .hero p {
        font-size: 20px;
        max-width: 600px;
        margin-bottom: 20px;
      }
      .cta-btn {
        background-color: #ff5722;
        color: white;
        padding: 12px 30px;
        text-decoration: none;
        font-size: 18px;
        border-radius: 25px;
        transition: background 0.3s;
      }
      .cta-btn:hover {
        background-color: #e64a19;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Build Your Next Big Project</h1>
      <p>
        Create sleek, responsive, and modern websites using simple HTML & CSS
        foundations.
      </p>
      <a href="#" class="cta-btn">Get Started Now</a>
    </section>
  </body>
</html>
