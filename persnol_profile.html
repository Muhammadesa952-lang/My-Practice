<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        padding: 20px;
        text-align: center;
      }
      .card img {
        border-radius: 50%;
        width: 100px;
        height: 100px;
        object-fit: cover;
      }
      .card h2 {
        margin: 10px 0 5px;
        color: #333;
      }
      .card p {
        color: #777;
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
      .btn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://via.placeholder.com/100" alt="Profile Picture" />
      <h2>Muhammad Esa</h2>
      <p>Web Developer & Designer</p>
      <p>Passionate about creating clean and user-friendly web experiences.</p>
      <a href="#" class="btn">Contact Me</a>
    </div>
  </body>
</html>
