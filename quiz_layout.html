<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Quiz</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: #eef2f3;
      }
      .quiz-container {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .question {
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: bold;
      }
      .options label {
        display: block;
        margin-bottom: 10px;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid #ddd;
      }
      .options label:hover {
        background: #e0e0e0;
      }
      .submit-btn {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 15px;
      }
      .submit-btn:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container">
      <div class="question">1. What does HTML stand for?</div>
      <form class="options">
        <label
          ><input type="radio" name="q1" value="a" /> Hyper Text Markup
          Language</label
        >
        <label
          ><input type="radio" name="q1" value="b" /> Home Tool Markup
          Language</label
        >
        <label
          ><input type="radio" name="q1" value="c" /> Hyperlinks and Text Markup
          Language</label
        >
        <button type="button" class="submit-btn" onclick="alert('Submitted!')">
          Submit Answer
        </button>
      </form>
    </div>
  </body>
</html>
